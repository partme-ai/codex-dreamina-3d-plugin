name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned Blender companion
        uses: actions/checkout@v7
        with:
          repository: partme-ai/codex-blender-plugin
          ref: caf835c64787abc4cf113a494218dceb5f256ede
          path: companions/codex-blender-plugin
      - name: Checkout pinned Dreamina Design companion
        uses: actions/checkout@v7
        with:
          repository: partme-ai/codex-dreamina-design-plugin
          ref: 897f6cbbb4a002f7b0a5559385604c2a13b7cac9
          path: companions/codex-dreamina-design-plugin
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run strict production gate
        env:
          CODEX_BLENDER_REPO: ${{ github.workspace }}/companions/codex-blender-plugin
          CODEX_DREAMINA_DESIGN_REPO: ${{ github.workspace }}/companions/codex-dreamina-design-plugin
        run: python scripts/ci_gate.py --strict
      - name: Check whitespace
        run: git diff --check
